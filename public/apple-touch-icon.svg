<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <linearGradient id="appleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="applePlant" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <linearGradient id="appleBook" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>
  </defs>

  <rect width="180" height="180" rx="40" fill="url(#appleBg)" />
  <rect x="5" y="5" width="170" height="170" rx="36" fill="none" stroke="#FEF3C7" stroke-width="3" stroke-opacity="0.6" />

  <g transform="translate(90, 122)">
    <!-- Book -->
    <path d="M -56,8 Q -28,16 0,8 Q 28,16 56,8 L 56,-12 Q 28,-4 0,-10 Q -28,-4 -56,-12 Z" fill="#78350F" />
    <path d="M 0,8 Q -28,15 -54,6 L -54,-14 Q -28,-5 0,-12 Z" fill="url(#appleBook)" stroke="#FDE68A" stroke-width="1.5" />
    <path d="M 0,8 Q 28,15 54,6 L 54,-14 Q 28,-5 0,-12 Z" fill="url(#appleBook)" stroke="#FDE68A" stroke-width="1.5" />
    <path d="M -3,-11 L 3,-11 L 2,16 L 0,13 L -2,16 Z" fill="#DC2626" />
  </g>

  <!-- Garden Plant -->
  <path d="M 87,112 Q 90,85 90,65 Q 90,85 93,112 Z" fill="#92400E" />
  <circle cx="72" cy="65" r="20" fill="url(#applePlant)" />
  <circle cx="108" cy="65" r="20" fill="url(#applePlant)" />
  <circle cx="90" cy="50" r="24" fill="#10B981" />

  <!-- Center Word -->
  <g transform="translate(90, 64)">
    <circle cx="0" cy="-3" r="14" fill="#4C1D95" stroke="#FDE047" stroke-width="2" />
    <text x="0" y="2" font-family="'Readex Pro', Arial, sans-serif" font-weight="900" font-size="11" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">اسْمٌ</text>
  </g>

  <!-- Sparkles -->
  <g transform="translate(40, 38)">
    <path d="M 0,-8 L 2,-2 L 8,0 L 2,2 L 0,8 L -2,2 L -8,0 L -2,-2 Z" fill="#FDE047" />
  </g>
  <g transform="translate(140, 42)">
    <path d="M 0,-10 L 2.5,-2.5 L 10,0 L 2.5,2.5 L 0,10 L -2.5,2.5 L -10,0 L -2.5,-2.5 Z" fill="#FDE047" />
  </g>
</svg>
