<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Inner Glow / Shadow -->
    <radialGradient id="innerGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0" />
    </radialGradient>

    <!-- Plant Gradient -->
    <linearGradient id="plantGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Book Gradient -->
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>

    <!-- Gold Accent -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#78350F" flood-opacity="0.3" />
    </filter>
    
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- App Rounded Icon Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="112" fill="url(#innerGlow)" />
  
  <!-- Subtle Inner Border -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#FEF3C7" stroke-width="8" stroke-opacity="0.5" />

  <!-- Main Illustration Group -->
  <g filter="url(#dropShadow)" transform="translate(0, -10)">
    
    <!-- Open Book Base -->
    <g transform="translate(256, 340)">
      <!-- Book Spine Backing -->
      <path d="M -160,20 Q -80,45 0,25 Q 80,45 160,20 L 160,-35 Q 80,-10 0,-30 Q -80,-10 -160,-35 Z" fill="#78350F" />
      
      <!-- Book Pages Left -->
      <path d="M 0,22 Q -80,42 -155,15 L -155,-40 Q -80,-15 0,-35 Z" fill="url(#bookGrad)" stroke="#FDE68A" stroke-width="3" />
      <!-- Book Pages Right -->
      <path d="M 0,22 Q 80,42 155,15 L 155,-40 Q 80,-15 0,-35 Z" fill="url(#bookGrad)" stroke="#FDE68A" stroke-width="3" />

      <!-- Page Lines (Arabic Text Impression) -->
      <path d="M -130,-15 Q -70,5 -20,-10" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.7" />
      <path d="M -130,5 Q -70,25 -20,10" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.7" />
      
      <path d="M 130,-15 Q 70,5 20,-10" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.7" />
      <path d="M 130,5 Q 70,25 20,10" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.7" />

      <!-- Golden Bookmark Ribbon -->
      <path d="M -8,-32 L 8,-32 L 6,50 L 0,42 L -6,50 Z" fill="#DC2626" />
    </g>

    <!-- Sprouting Garden Tree (بستان) -->
    <!-- Tree Trunk -->
    <path d="M 248,310 Q 256,230 256,180 Q 256,230 264,310 Z" fill="#92400E" />
    
    <!-- Tree Foliage Canopy / Garden Lush Cloud -->
    <g filter="url(#softShadow)">
      <!-- Left Leaf Cluster -->
      <circle cx="210" cy="180" r="55" fill="url(#plantGrad)" />
      <!-- Right Leaf Cluster -->
      <circle cx="302" cy="180" r="55" fill="url(#plantGrad)" />
      <!-- Top Center Canopy -->
      <circle cx="256" cy="140" r="65" fill="#10B981" />
      <!-- Sub Leaves / Sprout Accents -->
      <circle cx="230" cy="150" r="40" fill="#34D399" />
      <circle cx="282" cy="150" r="40" fill="#6EE7B7" />
    </g>

    <!-- Arabic Calligraphy "اسم" Emblem in the Center -->
    <g transform="translate(256, 175)" filter="url(#softShadow)">
      <circle cx="0" cy="-10" r="38" fill="#4C1D95" stroke="#FDE047" stroke-width="4" />
      <!-- Arabic Letter / Word "اسم" -->
      <text x="0" y="2" font-family="'Readex Pro', 'Tajawal', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">اسْمٌ</text>
    </g>

    <!-- Floating Sparkles & Stars (المكافآت والنجوم) -->
    <!-- Top Left Star -->
    <g transform="translate(110, 110)">
      <path d="M 0,-24 L 6,-7 L 23,0 L 6,7 L 0,24 L -6,7 L -23,0 L -6,-7 Z" fill="url(#goldGrad)" />
      <circle cx="0" cy="0" r="4" fill="#FFFFFF" />
    </g>

    <!-- Top Right Star -->
    <g transform="translate(395, 120)">
      <path d="M 0,-30 L 8,-9 L 29,0 L 8,9 L 0,30 L -8,9 L -29,0 L -8,-9 Z" fill="url(#goldGrad)" />
      <circle cx="0" cy="0" r="5" fill="#FFFFFF" />
    </g>

    <!-- Mid Right Sparkle -->
    <g transform="translate(420, 240)">
      <path d="M 0,-16 L 4,-5 L 15,0 L 4,5 L 0,16 L -4,5 L -15,0 L -4,-5 Z" fill="#FEF08A" />
    </g>

    <!-- Mid Left Sparkle -->
    <g transform="translate(90, 230)">
      <path d="M 0,-18 L 5,-5 L 17,0 L 5,5 L 0,18 L -5,5 L -17,0 L -5,-5 Z" fill="#FEF08A" />
    </g>
  </g>

  <!-- Bottom App Title Banner Text -->
  <g transform="translate(256, 455)">
    <rect x="-140" y="-22" width="280" height="44" rx="22" fill="#78350F" opacity="0.85" />
    <text x="0" y="3" font-family="'Readex Pro', 'Tajawal', Arial, sans-serif" font-weight="800" font-size="22" fill="#FEF3C7" text-anchor="middle" dominant-baseline="middle">بُسْتَانُ الْأَسْمَاءِ</text>
  </g>
</svg>
